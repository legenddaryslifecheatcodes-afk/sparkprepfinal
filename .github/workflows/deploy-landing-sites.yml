# Puts the SparkPrep topic sites live, one Cloudflare Pages project per subdomain:
#   sites/landing   -> sparkprep-landing            -> sparkpreplanding.legenddary.com
#   sites/fix       -> sparkprep-landing-fix        -> sparkpreplandingfix.legenddary.com
#   sites/covers    -> sparkprep-landing-covers     -> sparkpreplandingcovers.legenddary.com
#   sites/errors    -> sparkprep-landing-errors     -> sparkpreplandingerrors.legenddary.com
#   sites/newauthor -> sparkprep-landing-new-author -> sparkpreplandingnewauthor.legenddary.com
# (The list lives in content/landing-sites/shared.mjs; keep this matrix in step with it.)
# Uses the same two repository secrets as the main deploy: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# It creates each Pages project the first time, deploys it, and asks Cloudflare to attach the custom domain.
# The owner still adds one CNAME per subdomain at Namecheap (DNS lives there, not at Cloudflare).
# This does not touch the main site (sparkprep-live).
name: Deploy topic sites

on:
  push:
    branches: [sparkprep-logo-and-ai-gating]
    paths:
      - "content/landing-sites/**"
      - "scripts/build-landing-sites.mjs"
      - "scripts/check-landing-sites.mjs"
      - ".github/workflows/deploy-landing-sites.yml"
      - "analytics.json"
      - "scripts/inject-analytics.mjs"
      - "scripts/inject-tracker.mjs"
  workflow_dispatch:

concurrency:
  group: deploy-topic-sites
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: landing,   project: sparkprep-landing,            host: sparkpreplanding.legenddary.com }
          - { key: fix,       project: sparkprep-landing-fix,        host: sparkpreplandingfix.legenddary.com }
          - { key: covers,    project: sparkprep-landing-covers,     host: sparkpreplandingcovers.legenddary.com }
          - { key: errors,    project: sparkprep-landing-errors,     host: sparkpreplandingerrors.legenddary.com }
          - { key: newauthor, project: sparkprep-landing-new-author, host: sparkpreplandingnewauthor.legenddary.com }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Plain Node, no npm install needed: the generator has no dependencies.
      - run: node scripts/build-landing-sites.mjs

      # Stops the deploy if a sitemap, robots.txt, canonical or link between pages is wrong.
      - name: Check sitemaps, robots.txt, canonicals and internal links
        run: node scripts/check-landing-sites.mjs

      - name: Add Cloudflare Web Analytics (token from analytics.json)
        run: node scripts/inject-analytics.mjs sites/${{ matrix.key }} ${{ matrix.host }}

      - name: Add SparkPrep's own traffic counter
        run: node scripts/inject-tracker.mjs sites/${{ matrix.key }}

      - name: Create the Pages project (first run only)
        run: npx --yes wrangler@3 pages project create ${{ matrix.project }} --production-branch=main || echo "Project already exists"

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@3 pages deploy sites/${{ matrix.key }} --project-name=${{ matrix.project }} --branch=main --commit-dirty=true

      - name: Attach the custom domain (safe to repeat)
        continue-on-error: true
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/${{ matrix.project }}/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data '{"name":"${{ matrix.host }}"}' | head -c 600; echo

  # Proves the deploy worked: fetches every live sitemap and robots.txt over HTTPS, loads every
  # sitemap URL (must be 200 with no redirect, indexable, canonical = its own URL), checks links
  # between the topic pages and the links into sparkprep.legenddary.com.
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Give Cloudflare a moment to publish
        run: sleep 30
      - name: Check the live sitemaps over HTTPS
        run: node scripts/check-landing-sites.mjs --live

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-landing-sites.mjs
      - name: Tell Bing about the pages (IndexNow)
        run: node scripts/indexnow-landing-sites.mjs
        continue-on-error: true
