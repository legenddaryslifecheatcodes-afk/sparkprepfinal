<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Legenddary SparkPrep Demo</title>
<meta name="description" content="A 4-minute walkthrough of Legenddary SparkPrep, the A.P.P.S. (Automated Publishing Production System), from setup to final approval.">
<meta name="theme-color" content="#0b1220">
<style>
:root{--bg:#0b1220;--panel:#121a2c;--text:#f3f1ea;--muted:#a9b0c0;--gold:#f2c14e;--border:#26304a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:32px 16px 48px}
.eyebrow{color:var(--gold);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:.78rem}
h1{font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.15;margin:8px 0 6px}
.sub{color:var(--muted);margin-bottom:22px}
.player{background:#000;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
video{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#000}
.foot{margin-top:22px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;color:var(--muted);font-size:.95rem}
.btn{display:inline-block;background:var(--gold);color:#1a1405;font-weight:700;padding:12px 18px;border-radius:10px;text-decoration:none}
.sig{color:var(--text)}
</style>
</head>
<body>
<main class="wrap">
  <p class="eyebrow">A.P.P.S. (Automated Publishing Production System)</p>
  <h1>Legenddary SparkPrep: the whole process in 4 minutes</h1>
  <p class="sub">Real screens, step by step: setup, cover and inside pages, the scanners, the errors they find, the fix, and final approval.</p>
  <div class="player">
    <video controls playsinline preload="metadata" poster="poster.jpg">
      <source src="legenddary-sparkprep-demo.mp4" type="video/mp4">
      Your browser can't play this video. <a href="legenddary-sparkprep-demo.mp4">Download it here</a>.
    </video>
  </div>
  <div class="foot">
    <span class="sig">Joshua Davis, Founder, Legenddary</span>
    <a class="btn" href="https://sparkprep.legenddary.com/">Try Legenddary SparkPrep</a>
  </div>
</main>
</body>
</html>
